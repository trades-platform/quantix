[project]
name = "quantix"
version = "0.1.0"
description = "量化回测平台"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0",
    "lancedb>=0.20",
    "pandas>=2.2",
    "numpy>=2.0",
    "typer>=0.15",
    "httpx>=0.28",
    "python-multipart>=0.0.9",
    "tables>=3.9",
    "prettytable>=3.10",
    # 行情数据 SDK：wheel 在 wheels/ 目录（git-lfs 跟踪），见 [tool.uv] find-links
    "amazingdata>=1.0.17",
    "tgw>=1.0.8.1",
    "scipy",  # AmazingData 未在 wheel 中声明 Requires-Dist，需显式补上
]

[tool.uv]
# 本地 wheel 索引：tgw / amazingdata 从 wheels/ 解析，避免 uv sync 误删
find-links = ["wheels"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --tb=short"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[project.scripts]
quantix = "backend.cli.app:app"
